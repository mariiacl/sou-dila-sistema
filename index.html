<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sou Dila — Entrar</title>
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

  <!-- ========== TELA DE LOGIN ========== -->
  <div class="tela-login">
    <div class="card-login">
      <div class="logo">
        <h1>Sou Dila</h1>
        <p>Controle de Vendas</p>
      </div>

      <form id="form-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">

        <button type="submit" id="btn-entrar">Entrar</button>

        <div id="msg-login" class="msg-erro"></div>
      </form>
    </div>
  </div>

  <!-- SDK do Supabase (via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuração e autenticação -->
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>

</body>
</html>
