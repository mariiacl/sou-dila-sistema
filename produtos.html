<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sou Dila — Produtos</title>
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

  <button id="btn-menu-mobile" class="btn-menu-mobile" aria-label="Abrir menu">
    <span></span><span></span><span></span>
  </button>

  <!-- MENU LATERAL -->
  <aside id="menu-lateral" class="menu-lateral">
    <div class="menu-logo">
      <h1>Sou Dila</h1>
      <p>Painel de Gestão</p>
    </div>

    <nav class="menu-nav">
      <a href="dashboard.html"  class="menu-item">
        <span class="icone">🏠</span> Dashboard
      </a>
      <a href="vendas.html"     class="menu-item">
        <span class="icone">🛍️</span> Vendas
      </a>
      <a href="clientes.html"   class="menu-item">
        <span class="icone">👥</span> Clientes
      </a>
      <a href="produtos.html"   class="menu-item ativo">
        <span class="icone">📦</span> Produtos
      </a>
      <a href="estoque.html"    class="menu-item">
        <span class="icone">📊</span> Estoque
      </a>
      <a href="financeiro.html" class="menu-item">
        <span class="icone">💰</span> Financeiro
      </a>
      <a href="relatorios.html" class="menu-item">
        <span class="icone">📈</span> Relatórios
      </a>
    </nav>

    <div class="menu-rodape">
      <div class="menu-usuario">
        <span id="usuario-email"></span>
      </div>
      <button id="btn-sair" class="btn-sair">
        🚪 Sair
      </button>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <!-- CONTEÚDO -->
  <main class="conteudo-principal">

    <header class="topo">
      <h2>Produtos</h2>
      <span class="data-atual" id="data-atual"></span>
    </header>

    <section class="area-conteudo">

      <!-- BARRA DE AÇÕES -->
      <div class="barra-acoes">
        <div class="barra-titulo">
          <h3>Catálogo de Produtos</h3>
          <span id="contador-produtos" class="contador">0 produtos</span>
        </div>
        <button id="btn-novo-produto" class="btn-primario">
          + Novo Produto
        </button>
      </div>

      <!-- LISTA DE PRODUTOS -->
      <div class="bloco">
        <div id="lista-produtos">
          <p class="vazio">Carregando...</p>
        </div>
      </div>

    </section>

    <footer class="rodape">
      <p>Sou Dila © 2026 — Sistema Interno</p>
    </footer>

  </main>

  <!-- MODAL DE NOVO/EDITAR PRODUTO -->
  <div id="modal-produto" class="modal">
    <div class="modal-conteudo">
      <div class="modal-header">
        <h3 id="modal-titulo">Novo Produto</h3>
        <button id="btn-fechar-modal" class="btn-fechar">✕</button>
      </div>

      <form id="form-produto">
        <input type="hidden" id="produto-id">

        <label for="produto-nome">Nome do produto *</label>
        <input type="text" id="produto-nome" required placeholder="Ex: Camiseta Oversized">

        <label for="produto-descricao">Descrição</label>
        <textarea id="produto-descricao" rows="3" placeholder="Ex: Malha 100% algodão, modelagem ampla"></textarea>

        <div class="linha-dupla">
          <div>
            <label for="produto-categoria">Categoria</label>
            <select id="produto-categoria">
              <option value="">— Selecione —</option>
            </select>
          </div>
          <div>
            <label for="produto-colecao">Coleção</label>
            <select id="produto-colecao">
              <option value="">— Selecione —</option>
            </select>
          </div>
        </div>

        <label for="produto-imagem">URL da imagem (opcional)</label>
        <input type="text" id="produto-imagem" placeholder="https://...">

        <div id="msg-produto" class="msg-erro"></div>

        <div class="modal-acoes">
          <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
          <button type="submit" id="btn-salvar" class="btn-primario">Salvar Produto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SDK + Módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/produtos.js"></script>

  <!-- Menu mobile + data -->
  <script>
    const btnMenu     = document.getElementById('btn-menu-mobile');
    const menuLateral = document.getElementById('menu-lateral');
    const overlay     = document.getElementById('overlay');

    function abrirMenu() {
      menuLateral.classList.add('aberto');
      overlay.classList.add('ativo');
    }
    function fecharMenu() {
      menuLateral.classList.remove('aberto');
      overlay.classList.remove('ativo');
    }

    if (btnMenu) btnMenu.addEventListener('click', abrirMenu);
    if (overlay) overlay.addEventListener('click', fecharMenu);

    const dataAtual = document.getElementById('data-atual');
    if (dataAtual) {
      const hoje = new Date();
      dataAtual.textContent = hoje.toLocaleDateString('pt-BR', {
        weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
      });
    }
  </script>

</body>
</html>
